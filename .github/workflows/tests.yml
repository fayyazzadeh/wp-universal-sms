name: Tests

on:
  push:
    branches:
      - main
      - "feature/**"
      - "development"
  pull_request:

jobs:
  phpunit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ["8.1", "8.2", "8.3"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Lint plugin bootstrap
        run: php -l wp-universal-sms.php

      - name: Run tests
        run: composer test

  gsm-agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gsm-agent

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Agent test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"

      - name: Run GSM Agent tests
        run: python -m pytest -q
