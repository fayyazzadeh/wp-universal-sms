name: GSM Agent Task 2 Red
on:
  push:
    branches:
      - feature/phase-3-gsm-agent-domain

jobs:
  test-task2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Agent
        run: |
          python -m pip install --upgrade pip
          pip install -e ./gsm-agent
      - name: Run Task 2 focused tests
        working-directory: gsm-agent
        run: python -m pytest tests/integration/test_sqlite_persistence.py tests/unit/test_retry_policy.py tests/unit/test_idempotency.py tests/integration/test_queue_recovery.py -q
